<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bangla Panjika — app mockups (sample data)</title>
<!--
  Mockups of the finished MVP, built from the PRD (§10–§13). NOT production code.
  EVERY date, time, tithi and festival here is SAMPLE (নমুনা) data taken from or derived from the
  PRD wireframes. None of it is a verified religious date.
  Fonts: Tiro Bangla, Noto Sans Bengali, Noto Sans (SIL OFL 1.1), loaded from Google Fonts for preview only.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600&family=Noto+Sans:wght@400;500;600&family=Tiro+Bangla&display=swap" rel="stylesheet">
<style>
  /* ---------- Tokens (§12.2) ---------- */
  :root {
    --ink:#1F1A3D; --ink-muted:#5B567A; --paper:#FFFFFF; --paper-raised:#F6F4FB;
    --alta:#B4232C; --haldi:#E3A21A; --haldi-strong:#B07607; --durba:#2E7A4E; --rule:#E2DFEE;
    --alta-container:#FBE9EA; --haldi-container:#FCF1D6; --on-haldi-container:#5C3D00; --durba-container:#E3F2E9;
    --neel:#3949AB; --padma:#AD1457; --page:#E9E7F1; --ts:1;
  }
  [data-theme="dark"] {
    --ink:#ECEAF7; --ink-muted:#A9A5C4; --paper:#15132B; --paper-raised:#1E1C38;
    --alta:#F0707A; --haldi:#F2BE4E; --haldi-strong:#F2BE4E; --durba:#6CC596; --rule:#2E2B4D;
    --alta-container:#4A1D26; --haldi-container:#3D3014; --on-haldi-container:#FFE3A3; --durba-container:#173A2A;
    --neel:#9FA8DA; --padma:#F48FB1; --page:#0B0A18;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--page); color:var(--ink); font-family:"Noto Sans","Noto Sans Bengali",sans-serif; }
  button { font:inherit; color:inherit; }

  header.controls { position:sticky; top:0; z-index:20; display:flex; flex-wrap:wrap; gap:10px 22px; align-items:center;
    padding:12px 24px; background:var(--paper); border-bottom:1px solid var(--rule); }
  header.controls h1 { font:600 15px/1.3 "Noto Sans",sans-serif; margin:0 10px 0 0; }
  header.controls h1 small { display:block; font-weight:400; font-size:12px; color:var(--ink-muted); }
  .seg { display:inline-flex; border:1px solid var(--rule); border-radius:999px; overflow:hidden; vertical-align:middle; }
  .seg button { border:0; background:transparent; padding:7px 14px; font-size:13px; font-weight:500; cursor:pointer; min-height:36px;
    font-family:"Noto Sans","Noto Sans Bengali",sans-serif; }
  .seg button[aria-pressed="true"] { background:var(--ink); color:var(--paper); }
  .clabel { font-size:12px; color:var(--ink-muted); margin-right:6px; }

  .group-title { max-width:1500px; margin:34px auto 6px; padding:0 24px; font:600 13px "Noto Sans",sans-serif;
    letter-spacing:.06em; text-transform:uppercase; color:var(--ink-muted); }
  .gallery { display:flex; flex-wrap:wrap; justify-content:center; gap:36px 32px; padding:14px 16px 10px; max-width:1500px; margin:0 auto; }
  figure { margin:0; }
  figcaption { text-align:center; font-size:13px; color:var(--ink-muted); margin-top:12px; max-width:320px; }
  figcaption b { color:var(--ink); font-weight:600; display:block; }

  /* ---------- Phone ---------- */
  .phone { width:320px; height:690px; background:var(--paper); border-radius:34px; position:relative; overflow:hidden;
    box-shadow:0 0 0 9px #07060f, 0 22px 50px rgba(20,16,50,.25); display:flex; flex-direction:column; }
  .sb { height:26px; flex:none; display:flex; justify-content:space-between; align-items:center; padding:0 20px;
    font:500 11px "Noto Sans",sans-serif; }
  .scroll { flex:1; overflow-y:auto; padding:2px 16px 20px; scrollbar-width:none; position:relative; }
  .scroll::-webkit-scrollbar { display:none; }
  .wm { position:absolute; inset:0; pointer-events:none; display:grid; place-items:center; z-index:9; }
  .wm span { transform:rotate(-32deg); font:600 40px "Noto Sans Bengali","Noto Sans",sans-serif; color:var(--alta); opacity:.09; white-space:nowrap; }

  /* ---------- Type per script (§12.3) ---------- */
  .bn { --fd:34px; --ld:48px; --fh:26px; --lh:36px; --ft:22px; --lt:30px; --fb:16px; --lb:26px; --fl:14px; --ll:22px; --fc:13px; --lc:20px;
        font-family:"Noto Sans Bengali","Noto Sans",sans-serif; }
  .en { --fd:32px; --ld:40px; --fh:24px; --lh:32px; --ft:20px; --lt:28px; --fb:16px; --lb:24px; --fl:14px; --ll:20px; --fc:12px; --lc:16px;
        font-family:"Noto Sans","Noto Sans Bengali",sans-serif; }
  .display { font-family:"Tiro Bangla",serif; font-size:calc(var(--fd)*var(--ts)); line-height:calc(var(--ld)*var(--ts)); }
  .headline{ font-family:"Tiro Bangla",serif; font-size:calc(var(--fh)*var(--ts)); line-height:calc(var(--lh)*var(--ts)); }
  .title   { font-family:"Tiro Bangla",serif; font-size:calc(var(--ft)*var(--ts)); line-height:calc(var(--lt)*var(--ts)); }
  .body    { font-size:calc(var(--fb)*var(--ts)); line-height:calc(var(--lb)*var(--ts)); }
  .lbl     { font-size:calc(var(--fl)*var(--ts)); line-height:calc(var(--ll)*var(--ts)); font-weight:500; }
  .cap     { font-size:calc(var(--fc)*var(--ts)); line-height:calc(var(--lc)*var(--ts)); }
  .muted { color:var(--ink-muted); } .alta { color:var(--alta); } .durba { color:var(--durba); }
  .second { display:none; color:var(--ink-muted); }
  .both .second { display:block; }
  .tnum { font-variant-numeric:tabular-nums; }

  /* ---------- Common parts ---------- */
  .appbar { display:flex; align-items:center; gap:6px; min-height:52px; margin:0 -6px; }
  .appbar .ib { width:44px; height:44px; display:grid; place-items:center; border-radius:50%; flex:none; }
  .appbar .grow { flex:1; }
  .ib svg, .ico { width:22px; height:22px; }
  .chip { display:inline-flex; align-items:center; gap:6px; min-height:38px; padding:0 13px; border-radius:999px;
    background:var(--paper-raised); border:1px solid var(--rule); white-space:nowrap; }
  .chip svg { width:15px; height:15px; }
  .chip.on { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .chips { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding:2px 0 6px; margin:0 -16px; padding-left:16px; padding-right:16px; }
  .chips::-webkit-scrollbar { display:none; }
  .section { margin-top:22px; }
  .shead { color:var(--ink-muted); margin:0 0 4px; display:flex; align-items:center; gap:10px; }
  .shead::after { content:""; flex:1; height:1px; background:var(--rule); }
  .row { display:flex; flex-wrap:wrap; align-items:baseline; gap:0 12px; min-height:46px; padding:10px 0; }
  .row .k { min-width:78px; flex:none; color:var(--ink-muted); }
  .row .v { flex:1; min-width:140px; }
  .list-row { display:flex; align-items:center; gap:12px; min-height:56px; padding:8px 0; border-bottom:1px solid var(--rule); }
  .list-row:last-child { border-bottom:0; }
  .list-row .grow { flex:1; min-width:0; }
  .card { background:var(--paper-raised); border-radius:14px; padding:12px 14px; }
  .btn { display:flex; align-items:center; justify-content:center; gap:8px; min-height:48px; border-radius:999px; border:0; padding:0 20px;
    background:var(--ink); color:var(--paper); font-weight:600; width:100%; }
  .btn.ghost { background:transparent; color:var(--ink); border:1px solid var(--rule); }
  .btnrow { display:flex; gap:10px; } .btnrow .btn { flex:1; }
  .toggle { width:46px; height:28px; border-radius:999px; background:var(--rule); position:relative; flex:none; }
  .toggle::after { content:""; position:absolute; top:4px; left:4px; width:20px; height:20px; border-radius:50%; background:var(--paper); box-shadow:0 1px 2px rgba(0,0,0,.2); }
  .toggle.on { background:var(--durba); } .toggle.on::after { left:22px; }
  .badge { color:var(--durba); font-weight:600; white-space:nowrap; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--ink-muted); display:inline-block; }
  .bar { width:4px; align-self:stretch; border-radius:0 4px 4px 0; flex:none; }
  .c-puja { background:var(--alta); } .c-vrata { background:var(--neel); } .c-tithi { background:var(--haldi-strong); } .c-utsav { background:var(--padma); } .c-jayanti { background:var(--ink-muted); }
  .obs { display:flex; align-items:center; gap:12px; min-height:56px; padding:8px 12px 8px 0; border-radius:12px; background:var(--paper-raised); margin-top:8px; overflow:hidden; }
  .obs .grow { flex:1; min-width:0; }
  .search { display:flex; align-items:center; gap:10px; min-height:48px; padding:0 14px; border-radius:999px; background:var(--paper-raised); border:1px solid var(--rule); }
  .search svg { width:20px; height:20px; color:var(--ink-muted); flex:none; }
  .prov { margin-top:22px; padding-top:10px; border-top:1px solid var(--rule); color:var(--ink-muted); }

  .nav { flex:none; display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--rule); background:var(--paper); padding:5px 2px 12px; }
  .nav a { display:flex; flex-direction:column; align-items:center; gap:3px; min-height:54px; justify-content:center; color:var(--ink-muted); text-decoration:none; text-align:center; }
  .nav a svg { width:22px; height:22px; }
  .nav .pill { padding:4px 18px; border-radius:999px; display:grid; place-items:center; }
  .nav a.cur { color:var(--ink); } .nav a.cur .pill { background:var(--haldi-container); color:var(--on-haldi-container); }

  /* ---------- Today ---------- */
  .seal { margin:14px 0 6px; padding:16px; border-radius:20px; background:var(--haldi-container); display:flex; gap:14px; align-items:center; }
  .ring { flex:none; width:68px; height:68px; position:relative; }
  .ring > svg { width:68px; height:68px; transform:rotate(-90deg); }
  .ring .trk { stroke:color-mix(in srgb, var(--haldi-strong) 22%, transparent); }
  .ring .prg { stroke:var(--haldi-strong); stroke-linecap:round; }
  .ring .moon { position:absolute; inset:0; display:grid; place-items:center; }
  .seal .until { color:var(--on-haldi-container); }
  .bn .sealname { font-size:calc(28px*var(--ts)); line-height:calc(40px*var(--ts)); }
  .en .sealname { font-size:calc(26px*var(--ts)); line-height:calc(34px*var(--ts)); }
  .timing { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .tcell { background:var(--paper-raised); border-radius:12px; padding:9px 11px; display:flex; gap:9px; align-items:center; min-height:54px; }
  .tcell svg { width:20px; height:20px; flex:none; color:var(--haldi-strong); }
  .tcell.m svg { color:var(--ink-muted); }
  .period { display:flex; justify-content:space-between; align-items:center; gap:8px; min-height:46px; padding:6px 12px; border-radius:12px; margin-top:6px; }
  .period.active { background:var(--alta-container); }
  .period.good.active { background:var(--durba-container); }
  .now { display:inline-flex; align-items:center; gap:5px; color:var(--alta); font-weight:600; margin-right:6px; }
  .now::before { content:""; width:7px; height:7px; border-radius:50%; background:currentColor; }
  .adslot { margin-top:20px; border:1px dashed var(--rule); border-radius:14px; padding:14px; text-align:center; color:var(--ink-muted); }

  /* ---------- Calendar ---------- */
  .calhead { display:flex; align-items:center; justify-content:space-between; gap:4px; min-height:52px; }
  .calhead .ttl { display:flex; align-items:center; gap:4px; }
  .seg.full { display:flex; width:100%; } .seg.full button { flex:1; }
  .wk { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; margin-top:12px; color:var(--ink-muted); }
  .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-top:4px; }
  .cell { min-height:58px; border-radius:10px; display:flex; flex-direction:column; align-items:center; padding:5px 0 4px; position:relative; }
  .cell .b { font-size:calc(16px*var(--ts)); line-height:1.25; font-weight:500; }
  .cell .g { font-size:calc(10.5px*var(--ts)); color:var(--ink-muted); line-height:1.3; }
  .cell .mk { height:12px; display:flex; align-items:center; gap:3px; margin-top:1px; font-size:10px; font-weight:600; }
  .cell .fbar { position:absolute; left:8px; right:8px; bottom:2px; height:3px; border-radius:2px; background:var(--alta); }
  .cell.sun .b { color:var(--alta); }
  .cell.today { box-shadow:inset 0 0 0 2px var(--haldi-strong); }
  .cell.sel { background:var(--haldi-container); }
  .m-full { width:8px; height:8px; border-radius:50%; background:var(--ink); }
  .m-hollow { width:8px; height:8px; border-radius:50%; border:1.5px solid var(--ink); }
  .m-ek { color:var(--neel); }
  .selstrip { margin-top:14px; padding:12px 14px; border-radius:14px; background:var(--paper-raised); display:flex; align-items:center; gap:10px; }
  .selstrip .grow { flex:1; }
  .linkbtn { color:var(--ink); font-weight:600; padding:8px 12px; border-radius:999px; border:1px solid var(--rule); white-space:nowrap; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:10px; color:var(--ink-muted); }
  .legend span { display:inline-flex; align-items:center; gap:5px; }

  /* ---------- Festival detail ---------- */
  .band { margin:0 -16px; padding:18px 16px 18px; background:var(--alta); color:#fff; }
  [data-theme="dark"] .band { background:#7A1820; }
  .band .muted2 { color:rgba(255,255,255,.85); }
  .daysel { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; margin:12px -16px 0; padding:0 16px; }
  .daysel::-webkit-scrollbar { display:none; }
  .daysel span { padding:8px 13px; border-radius:999px; border:1px solid var(--rule); white-space:nowrap; min-height:38px; display:inline-flex; align-items:center; }
  .daysel span.on { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .vcard { margin-top:18px; padding:12px 14px; border-radius:14px; background:var(--durba-container); display:flex; gap:10px; }

  /* ---------- Onboarding ---------- */
  .dots { display:flex; justify-content:center; gap:7px; margin:14px 0 10px; }
  .dots i { width:8px; height:8px; border-radius:50%; background:var(--rule); } .dots i.on { background:var(--ink); width:22px; border-radius:4px; }
  .opt { border:1.5px solid var(--rule); border-radius:16px; padding:14px; margin-top:12px; display:flex; gap:12px; }
  .opt.on { border-color:var(--ink); background:var(--paper-raised); }
  .radio { width:20px; height:20px; border-radius:50%; border:2px solid var(--ink-muted); flex:none; margin-top:3px; }
  .opt.on .radio { border-color:var(--ink); box-shadow:inset 0 0 0 4px var(--paper-raised), inset 0 0 0 10px var(--ink); }
  .soon { display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--haldi-container); color:var(--on-haldi-container); margin-left:4px; }
  .onb-foot { position:absolute; left:16px; right:16px; bottom:20px; }

  /* ---------- Share card ---------- */
  .sharecard { width:300px; height:375px; border-radius:18px; overflow:hidden; position:relative; background:#FFF8EE; color:#1F1A3D;
    box-shadow:0 18px 40px rgba(20,16,50,.22); display:flex; flex-direction:column; align-items:center; text-align:center; padding:26px 22px; }
  [data-theme="dark"] .sharecard { background:#1E1C38; color:#ECEAF7; }
  .sharecard .alp { position:absolute; inset:0; opacity:.9; }
  .sharecard .inner { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; height:100%; }
</style>
</head>
<body>
<header class="controls">
  <h1>Bangla Panjika: app mockups <small>Built from the PRD · every value is sample data (নমুনা), not a verified date</small></h1>
  <div><span class="clabel">Language</span><span class="seg" id="c-lang"><button aria-pressed="true" data-v="bn">বাংলা</button><button aria-pressed="false" data-v="en">English</button></span></div>
  <div><span class="clabel">Theme</span><span class="seg" id="c-theme"><button aria-pressed="true" data-v="light">Light</button><button aria-pressed="false" data-v="dark">Dark</button></span></div>
  <div><span class="clabel">Text</span><span class="seg" id="c-ts"><button aria-pressed="true" data-v="1">100%</button><button aria-pressed="false" data-v="1.3">130%</button></span></div>

</header>
<div id="root"></div>

calendar: () => {
  // SAMPLE month: 30 days, 1 Ashwin = Fri 18 Sep 2026 (derived from the PRD's sample "25 Ashwin = 12 Oct").
  const start = 5, len = 30, today = 25;
  const marks = {4:"full", 19:"hollow", 15:"ek", 30:"ek"}, fest = new Set([19,25,26,27,28,29]);
  let cells = "";
  for (let i = 0; i < start; i++) cells += `<div></div>`;
  for (let d = 1; d <= len; d++) {
    const g = 17 + d, gd = g > 30 ? g - 30 : g, wd = (start + d - 1) % 7;
    const m = marks[d] === "full" ? `<span class="m-full"></span>` : marks[d] === "hollow" ? `<span class="m-hollow"></span>` : marks[d] === "ek" ? `<span class="m-ek">${t("ekMark")}</span>` : "";
    cells += `<div class="cell ${wd===0?"sun":""} ${d===today?"today sel":""}"><span class="b">${num(d)}</span><span class="g">${num(gd)}</span><span class="mk">${m}</span>${fest.has(d)?'<span class="fbar"></span>':""}</div>`;
  }
  return `<div class="calhead"><span class="ib">${ic("left")}</span><span class="ttl title">${t("calTitle")} ${ic("down")}</span><span class="ib">${ic("right")}</span><span class="chip lbl">${t("todayBtn")}</span></div>
  <div style="display:flex;gap:8px;align-items:center"><span class="seg full cap"><button aria-pressed="true">${t("modeBn")}</button><button aria-pressed="false">${t("modeEn")}</button></span><span class="ib" style="width:40px;height:40px;display:grid;place-items:center">${ic("info")}</span></div>
  <div class="wk cap">${t("wk").map((w,i)=>`<span class="${i===0?"alta":""}">${w}</span>`).join("")}</div>
  <div class="grid">${cells}</div>
  <div class="legend cap"><span><span class="m-full"></span>${t("lgFull")}</span><span><span class="m-hollow"></span>${t("lgHollow")}</span><span><b class="m-ek">${t("ekMark")}</b>${t("lgEk")}</span><span><span style="width:14px;height:3px;background:var(--alta);border-radius:2px;display:inline-block"></span>${t("lgFest")}</span></div>
  <div class="selstrip"><div class="grow"><div class="lbl">${t("selected")}</div><div class="cap muted">${t("selInfo")}</div></div><span class="linkbtn lbl">${t("view")}</span></div>`;
},

  ${r("sTime", `<span class="lbl muted">${t("sTimeV")}</span>`, ic("down"))}

  <div class="section">${shead("hData")}${r("sUpdate", `<span class="lbl muted">${t("sUpdateV")}</span>`, ic("chev"))}${r("sYears", `<span class="lbl muted">${t("sYearsV")}</span>`, ic("chev"))}</div>
  <div class="section">${shead("hOtherS")}${["sAds","sPrivacy","sLicence","sAbout"].map(k=>r(k,"",ic("chev"))).join("")}</div>`;
},

more: () => `<div class="appbar" style="margin:0"><span class="grow title">${t("moreTitle")}</span></div>
  <div class="card" style="display:flex;align-items:center;gap:10px"><span class="grow lbl">${t("sLang")}</span><span class="seg cap"><button aria-pressed="${S.lang==="bn"}" style="font-family:'Noto Sans Bengali'">বাংলা</button><button aria-pressed="${S.lang==="en"}" style="font-family:'Noto Sans'">English</button></span></div>
  <div style="margin-top:10px">${t("moreItems").map(([i,l])=>`<div class="list-row"><span style="color:var(--ink-muted)">${ic(i)}</span><span class="grow body">${l}</span>${ic("chev")}</div>`).join("")}</div>`,

sources: () => `${appbar(t("srcTitle"))}
  <div class="lbl" style="margin-top:6px">${t("srcHow")}</div>
  ${t("srcSteps").map((s,i)=>`<div class="list-row"><span style="width:30px;height:30px;border-radius:50%;background:var(--haldi-container);color:var(--on-haldi-container);display:grid;place-items:center;font-weight:600;flex:none" class="cap">${num(i+1)}</span><span class="grow body">${s}</span></div>`).join("")}
  <div class="section">${shead("srcMarks")}
    <div class="list-row"><span class="badge body" style="width:30px">✓✓</span><span class="body">${t("mExpert")}</span></div>
    <div class="list-row"><span class="badge body" style="width:30px">✓</span><span class="body">${t("mRef")}</span></div>
    <div class="list-row"><span style="width:30px"><span class="dot"></span></span><span class="body">${t("mComp")}</span></div></div>
  <div class="section">${shead("srcPhone")}<div class="body">${t("srcPacks")}</div><div class="cap muted">${t("srcLast")}</div>
    <div class="list-row" style="margin-top:6px"><span class="grow body" style="font-weight:500">${t("srcWhy")}</span>${ic("chev")}</div></div>
  <button class="btn ghost" style="margin-top:14px">${ic("flag")} ${t("report")}</button>`,

search: () => `<div class="appbar"><span class="ib">${ic("back")}</span><div class="search body grow" style="flex:1">${ic("search")}<span>${t("sQuery")}</span><span style="width:2px;height:20px;background:var(--ink);margin-left:-8px"></span></div></div>
  <div class="cap muted" style="margin-top:6px">${t("sEx")}</div>
  <div class="section">${shead("hRes")}
    <div class="list-row">${ic("navCal")}<span class="grow body">${t("resDate")}</span>${ic("chev")}</div>
    <div class="list-row"><span class="bar c-puja" style="height:40px"></span><div class="grow"><div class="body">${t("resK1")}</div><div class="cap muted">${t("resK1d")}</div></div>${badge(2)}</div>
    <div class="list-row"><span class="bar c-puja" style="height:40px"></span><div class="grow"><div class="body">${t("resK2")}</div><div class="cap muted">${t("resK2d")}</div></div>${badge(2)}</div></div>`,

glossary: () => screens.today() + `<div style="position:absolute;inset:0;background:rgba(10,8,30,.42);z-index:5"></div>`,
};
function nmCity(i){ const a=T[S.lang].cities[i], b=T[S.lang==="bn"?"en":"bn"].cities[i]; return `<div class="body">${a[0]} <span class="muted cap">· ${a[1]}</span></div><div class="cap second">${b[0]}</div>`; }

/* ---------- gallery ---------- */
const GROUPS = [
  ["First run", [["onbLang","Onboarding · language","Shown in both scripts until the user chooses (§11.1)", false],["onbTrad","Onboarding · tradition","Two schools explained in one line each (US-02)", false]]],
  ["Daily use", [["today","Today","Tithi seal is the one bold element; active period highlighted; ad only below “Coming up” (§11.2, §20.2)", true],
                 ["calendar","Calendar","Bengali + Gregorian numbers per cell; markers by shape, not just colour (§11.3, US-06)", true],
                 ["day","Day detail","All periods; times after midnight marked “next day” (§11.4)", false],
                 ["glossary","Glossary sheet","Long-press any term for a plain explanation (FR-SET-07)", true]]],
  ["Festivals & reminders", [["festivals","Festival list","Grouped by Bengali month; ✓✓ expert-reviewed, ✓ checked (§11.5)", true],
                 ["festDetail","Festival detail","Multi-day selector and Sandhi Puja window (§11.6)", false],
                 ["reminders","Reminders","Recurring tithis and per-festival reminders (§11.13)", false],
                 ["share","Share card","1080×1350 image; Bengali, English or both (§11.8)", null]]],
  ["Settings & trust", [["more","More","Quick language switch at the top (§10)", true],["settings","Settings","Language, names in both scripts, theme, text size, numerals (§11.15)", false],
                 ["city","City picker","Search in both scripts; today's sunrise per city (§11.7)", false],["sources","Sources & verification","How the data is checked (§11.16)", false],["search","Search","Dates and festivals in either script (§11.14)", false]]],
];
const NAVIDX = { today:0, calendar:1, festivals:2, more:3, glossary:0 };

function phone(key){
  const body = screens[key]();
  const hasNav = key in NAVIDX;
  const sheet = key === "glossary" ? `<div style="position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-radius:20px 20px 0 0;padding:10px 18px 26px;box-shadow:0 -8px 30px rgba(0,0,0,.25)">
      <div style="width:36px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto 14px"></div>
      <div class="title">${t("gTerm")}</div><div class="cap second">${o("gTerm")}</div>
      <div class="body" style="margin-top:8px">${t("gText")}</div>
      <button class="btn ghost" style="margin-top:14px">${ic("book")} ${t("gMore")}</button></div>` : "";
  return `<div class="phone ${S.lang} ${S.both?"both":""}" lang="${S.lang}">
    <div class="wm" aria-hidden="true"><span>নমুনা · SAMPLE</span></div>
    <div class="sb"><span class="tnum">${t("sb")}</span><span>▾ ▴ ▮</span></div>
    <div class="scroll" ${key==="glossary"?'style="overflow:hidden"':""}>${body}</div>${sheet}
    ${hasNav ? nav(NAVIDX[key]) : ""}</div>`;
}
function shareCard(){
  return `<div class="sharecard ${S.lang} ${S.both?"both":""}" lang="${S.lang}">
    <svg class="alp" viewBox="0 0 300 375" aria-hidden="true" fill="none" stroke="var(--alta)" stroke-width="1.4" opacity=".55">
      <rect x="12" y="12" width="276" height="351" rx="12"/><rect x="20" y="20" width="260" height="335" rx="9" stroke-dasharray="2 5"/>
      <g transform="translate(150 300)">${[0,45,90,135,180,225,270,315].map(a=>`<path transform="rotate(${a})" d="M0 0 C 8 -10 8 -22 0 -32 C -8 -22 -8 -10 0 0Z"/>`).join("")}<circle r="5"/></g>
      <g stroke="var(--haldi-strong)">${[40,260].map(x=>`<circle cx="${x}" cy="40" r="6"/><circle cx="${x}" cy="40" r="11" stroke-dasharray="2 3"/>`).join("")}</g></svg>
    <div class="inner">
      <div class="cap" style="color:var(--alta);font-weight:600;margin-top:28px">${t("scBy")}</div>
      <div class="display" style="margin-top:14px;font-size:calc(40px)">${t("fAshtami")}</div><div class="cap second">${o("fAshtami")}</div>
      <div class="body" style="margin-top:10px">${t("scDate")}</div><div class="cap" style="opacity:.75">${t("scDate2")}</div>
      <div style="flex:1"></div>
      <div class="lbl" style="margin-bottom:84px;opacity:.85">${t("scApp")}</div>
    </div></div>`;
}
function render(){
  document.documentElement.lang = S.lang;
  document.getElementById("root").innerHTML = GROUPS.map(([g, items]) =>
    `<div class="group-title">${g}</div><div class="gallery">${items.map(([k,title,cap]) =>
      `<figure>${k==="share"?shareCard():phone(k)}<figcaption><b>${title}</b>${cap}</figcaption></figure>`).join("")}</div>`).join("") +
    `<p style="text-align:center;color:var(--ink-muted);font-size:12px;padding:30px 16px 60px">All values are sample data from the PRD wireframes. Layout and tokens follow spec/design-system.md; final designs need sign-off (Phase 2, T-215).</p>`;
}
function seg(id, fn){
  const el = document.getElementById(id);
  el.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
    el.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); fn(b.dataset.v); });
}
seg("c-lang", v => { S.lang = v; render(); });
seg("c-theme", v => document.documentElement.dataset.theme = v);
seg("c-ts", v => document.documentElement.style.setProperty("--ts", v));
seg("c-both", v => { S.both = v === "on"; render(); });
render();
</script>
</body>
</html>
