name: panjika
description: "Bangla Panjika: Bengali calendar app (Bengali and English)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.7"

# Every package is recorded in ../docs/dependencies.md before it is added (CLAUDE.md).
dependencies:
  cryptography: ^2.9.0
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  geolocator_android: ^5.1.1+1
  go_router: ^18.0.2
  http: ^1.6.0
  intl: any
  package_info_plus: ^10.2.2
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
  sqlite3: ^3.5.2
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/OFL-TiroBangla.txt
    - assets/fonts/OFL-NotoSansBengali.txt
    - assets/fonts/OFL-NotoSans.txt
    - assets/legal/DATA-NOTICE.txt

  # Bundled, subset fonts (spec §12.3, docs/assets.md). Static instances only: Tiro Bangla
  # is regular-only (never synthesise bold); Noto weights 400/500/600.
  fonts:
    - family: TiroBangla
      fonts:
        - asset: assets/fonts/TiroBangla-Regular.ttf
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansBengali-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansBengali-SemiBold.ttf
          weight: 600
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-SemiBold.ttf
          weight: 600
