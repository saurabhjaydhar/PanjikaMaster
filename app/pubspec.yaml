name: panjika
description: "Bangla Panjika: Bengali calendar app (Bengali and English)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.7"

# Every package is recorded in ../docs/dependencies.md before it is added (CLAUDE.md).
dependencies:
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
  sqlite3: ^3.5.2

flutter:
  uses-material-design: true
  generate: true
