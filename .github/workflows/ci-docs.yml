name: ci-docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "CLAUDE.md", "data/**/*.md", "scripts/check_docs.py", ".github/workflows/ci-docs.yml"]
  pull_request:
    paths: ["docs/**", "CLAUDE.md", "data/**/*.md", "scripts/check_docs.py", ".github/workflows/ci-docs.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_docs.py
