name: ci-app

on:
  push:
    branches: [main]
    paths: ["app/**", "data/pack/schema.sql", "scripts/check_release_bundle.sh", "scripts/check_l10n.py", ".github/workflows/ci-app.yml"]
  pull_request:
    paths: ["app/**", "data/pack/schema.sql", "scripts/check_release_bundle.sh", "scripts/check_l10n.py", ".github/workflows/ci-app.yml"]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - run: flutter pub get
      # Generated Drift code must be committed and current.
      - name: Generated code is up to date
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/
      - run: dart format --output=none --set-exit-if-changed lib test
      # Both languages complete and no hard-coded UI strings (spec §13.5).
      - run: python3 ../scripts/check_l10n.py
      - run: flutter analyze
      - run: flutter test
      # Domain logic must not depend on the device time zone (spec §16): UTC+14 and UTC−10.
      - name: Domain tests in other time zones
        run: |
          TZ=Pacific/Kiritimati flutter test test/domain
          TZ=Pacific/Honolulu flutter test test/domain
      - run: flutter build apk --release
      - name: Release APK contains no sample data
        run: ../scripts/check_release_bundle.sh build/app/outputs/flutter-apk/app-release.apk

  # T-115: run the app on an Android 14 emulator (GitHub's Ubuntu runners support KVM).
  # Also the device launch check for T-104 and the real per-app language channel.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: app
          script: flutter test integration_test/app_smoke_test.dart
