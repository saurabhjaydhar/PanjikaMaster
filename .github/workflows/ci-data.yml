name: ci-data

on:
  push:
    branches: [main]
    paths: ["data/**", "app/lib/data/db/*.drift", "scripts/sync_drift_schema.py", ".github/workflows/ci-data.yml"]
  pull_request:
    paths: ["data/**", "app/lib/data/db/*.drift", "scripts/sync_drift_schema.py", ".github/workflows/ci-data.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      # The app's Drift tables are generated from data/pack/schema.sql (T-106).
      - run: python ../scripts/sync_drift_schema.py --check
